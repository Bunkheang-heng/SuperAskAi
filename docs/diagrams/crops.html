<!doctype html><meta charset="utf-8"><body style="background:#222;color:#eee;font:14px system-ui">
<div id="log">rendering…</div>
<script>
// Renders magnified crops of the To-Be SVG so tight areas can be checked for collisions.
const W = 3720, H = 2800, Z = 1.6;
const CROPS = [
  { name: 'crop-a-endpills.png',  x: 620,  y: 700,  w: 1400, h: 400 },
  { name: 'crop-b-citizen.png',   x: 2300, y: 160,  w: 1420, h: 360 },
  { name: 'crop-c-trackA.png',    x: 2280, y: 1840, w: 1440, h: 420 },
  { name: 'crop-d-return.png',    x: 2280, y: 940,  w: 1000, h: 420 },
];
const log = m => document.getElementById('log').textContent = m;
(async () => {
  const svg = await (await fetch('askgov-tobe-process-flow.svg?' + Date.now())).text();
  const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  const img = new Image();
  img.onerror = () => log('img load failed');
  img.onload = async () => {
    const done = [];
    for (const c of CROPS) {
      const cv = document.createElement('canvas');
      cv.width = Math.round(c.w * Z); cv.height = Math.round(c.h * Z);
      const g = cv.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
      g.drawImage(img, c.x, c.y, c.w, c.h, 0, 0, cv.width, cv.height);
      const r = await fetch('/save/' + c.name, { method: 'POST', body: cv.toDataURL('image/png') });
      done.push(await r.text());
      log(done.join(' | '));
    }
    log('DONE — ' + done.join(' | '));
  };
  img.src = url;
})();
</script>
