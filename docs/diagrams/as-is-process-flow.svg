<svg xmlns="http://www.w3.org/2000/svg" width="1710" height="1230" viewBox="0 0 1710 1230" font-family="Inter, Arial, Helvetica, sans-serif">

  <rect x="0" y="0" width="1710" height="1230" fill="#FFFFFF"/>

  <!-- TITLE -->
  <text x="30" y="52" font-size="28" font-weight="700" fill="#12263A">2.1.1 Current Process (As-Is)</text>
  <text x="30" y="80" font-size="14" fill="#5B6B7B">How a Cambodian citizen answers a procedural question today — and what it costs when the answer is wrong.</text>

  <!-- CITIZEN LANE -->
  <rect x="30" y="110" width="1650" height="840" rx="14" fill="#F7FAFC" stroke="#DCE5ED" stroke-width="1"/>
  <text x="52" y="136" font-size="11.5" font-weight="700" fill="#8FA0AF" letter-spacing="1.6">CITIZEN</text>

  <!-- Start node -->
  <rect x="625" y="150" width="460" height="62" rx="10" fill="#0B4F8F"/>
  <text x="855" y="177" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Citizen has a procedural question</text>
  <text x="855" y="197" font-size="12.5" fill="#BFD8EE" text-anchor="middle">What documents? What fee? Which office? By when?</text>

  <!-- Split -->
  <line x1="855" y1="212" x2="855" y2="232" stroke="#8FA0AF" stroke-width="1.5"/>
  <line x1="595" y1="232" x2="1385" y2="232" stroke="#8FA0AF" stroke-width="1.5"/>
  <line x1="595" y1="232" x2="595" y2="252" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="591,245 599,245 595,252" fill="#8FA0AF"/>
  <line x1="1385" y1="232" x2="1385" y2="252" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="1381,245 1389,245 1385,252" fill="#8FA0AF"/>

  <!-- Branch pills -->
  <rect x="405" y="252" width="380" height="32" rx="16" fill="#E8F1F9" stroke="#C3DAEE"/>
  <text x="595" y="272" font-size="12.5" font-weight="700" fill="#0B4F8F" text-anchor="middle" letter-spacing="0.6">PROCEDURE IS PUBLISHED SOMEWHERE</text>

  <rect x="1195" y="252" width="380" height="32" rx="16" fill="#FDECEC" stroke="#F3C9C9"/>
  <text x="1385" y="272" font-size="12.5" font-weight="700" fill="#9B2C2C" text-anchor="middle" letter-spacing="0.6">PROCEDURE WAS NEVER PUBLISHED</text>

  <!-- Spines for the six channels -->
  <line x1="595" y1="284" x2="595" y2="300" stroke="#8FA0AF" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="940" y2="300" stroke="#8FA0AF" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="60" y2="470" stroke="#8FA0AF" stroke-width="1.5"/>
  <line x1="60" y1="470" x2="940" y2="470" stroke="#8FA0AF" stroke-width="1.5"/>

  <line x1="250" y1="300" x2="250" y2="330" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="246,323 254,323 250,330" fill="#8FA0AF"/>
  <line x1="595" y1="300" x2="595" y2="330" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="591,323 599,323 595,330" fill="#8FA0AF"/>
  <line x1="940" y1="300" x2="940" y2="330" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="936,323 944,323 940,330" fill="#8FA0AF"/>

  <line x1="250" y1="470" x2="250" y2="500" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="246,493 254,493 250,500" fill="#8FA0AF"/>
  <line x1="595" y1="470" x2="595" y2="500" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="591,493 599,493 595,500" fill="#8FA0AF"/>
  <line x1="940" y1="470" x2="940" y2="500" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="936,493 944,493 940,500" fill="#8FA0AF"/>

  <!-- Channel 1: Web search -->
  <rect x="90" y="330" width="320" height="130" rx="10" fill="#FFFFFF" stroke="#D5DEE7"/>
  <text x="108" y="362" font-size="16" font-weight="700" fill="#12263A">Web search</text>
  <text x="108" y="386" font-size="12.5" fill="#5B6B7B">Ministry pages of unknown currency, mixed</text>
  <text x="108" y="406" font-size="12.5" fill="#5B6B7B">with news articles and broker sites.</text>
  <rect x="108" y="424" width="78" height="24" rx="12" fill="#FDF1E7" stroke="#F0D3BB"/>
  <text x="147" y="440" font-size="11.5" font-weight="700" fill="#A54B12" text-anchor="middle">Uncertain</text>

  <!-- Channel 2: Facebook page -->
  <rect x="435" y="330" width="320" height="130" rx="10" fill="#FFFFFF" stroke="#D5DEE7"/>
  <text x="453" y="362" font-size="16" font-weight="700" fill="#12263A">Ministry Facebook page</text>
  <text x="453" y="386" font-size="12.5" fill="#5B6B7B">An image of a Khmer notice. No date, no</text>
  <text x="453" y="406" font-size="12.5" fill="#5B6B7B">instrument, no sign of what it replaced.</text>
  <rect x="453" y="424" width="78" height="24" rx="12" fill="#FDF1E7" stroke="#F0D3BB"/>
  <text x="492" y="440" font-size="11.5" font-weight="700" fill="#A54B12" text-anchor="middle">Uncertain</text>

  <!-- Channel 3: Telegram -->
  <rect x="780" y="330" width="320" height="130" rx="10" fill="#FFFFFF" stroke="#D5DEE7"/>
  <text x="798" y="362" font-size="16" font-weight="700" fill="#12263A">Telegram channel</text>
  <text x="798" y="386" font-size="12.5" fill="#5B6B7B">The same announcements, carried faster</text>
  <text x="798" y="406" font-size="12.5" fill="#5B6B7B">and even less durably. It scrolls away.</text>
  <rect x="798" y="424" width="78" height="24" rx="12" fill="#FDF1E7" stroke="#F0D3BB"/>
  <text x="837" y="440" font-size="11.5" font-weight="700" fill="#A54B12" text-anchor="middle">Uncertain</text>

  <!-- Channel 4: Family / neighbour / group -->
  <rect x="90" y="500" width="320" height="130" rx="10" fill="#FFFFFF" stroke="#D5DEE7"/>
  <text x="108" y="532" font-size="16" font-weight="700" fill="#12263A">Family, neighbour or group</text>
  <text x="108" y="556" font-size="12.5" fill="#5B6B7B">Second-hand experience of a procedure</text>
  <text x="108" y="576" font-size="12.5" fill="#5B6B7B">that may since have changed.</text>
  <rect x="108" y="594" width="78" height="24" rx="12" fill="#FDF1E7" stroke="#F0D3BB"/>
  <text x="147" y="610" font-size="11.5" font-weight="700" fill="#A54B12" text-anchor="middle">Uncertain</text>

  <!-- Channel 5: Travel to the office -->
  <rect x="435" y="500" width="320" height="130" rx="10" fill="#FFFFFF" stroke="#D5DEE7"/>
  <text x="453" y="532" font-size="16" font-weight="700" fill="#12263A">Travel to the office</text>
  <text x="453" y="556" font-size="12.5" fill="#5B6B7B">The one authoritative channel — but it</text>
  <text x="453" y="576" font-size="12.5" fill="#5B6B7B">costs a trip, in working hours only.</text>
  <rect x="453" y="594" width="180" height="24" rx="12" fill="#E8F1F9" stroke="#C3DAEE"/>
  <text x="543" y="610" font-size="11.5" font-weight="700" fill="#0B4F8F" text-anchor="middle">Authoritative · but a trip</text>

  <!-- Channel 6: Broker -->
  <rect x="780" y="500" width="320" height="130" rx="10" fill="#FFFFFF" stroke="#D5DEE7"/>
  <text x="798" y="532" font-size="16" font-weight="700" fill="#12263A">Pay a broker</text>
  <text x="798" y="556" font-size="12.5" fill="#5B6B7B">Charges for public information, and has</text>
  <text x="798" y="576" font-size="12.5" fill="#5B6B7B">an interest in the procedure staying opaque.</text>
  <rect x="798" y="594" width="140" height="24" rx="12" fill="#FDECEC" stroke="#F3C9C9"/>
  <text x="868" y="610" font-size="11.5" font-weight="700" fill="#9B2C2C" text-anchor="middle">Cost · no assurance</text>

  <!-- Unpublished branch -->
  <line x1="1385" y1="284" x2="1385" y2="330" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="1381,323 1389,323 1385,330" fill="#8FA0AF"/>

  <rect x="1150" y="330" width="470" height="130" rx="10" fill="#FFFFFF" stroke="#F3C9C9"/>
  <text x="1170" y="362" font-size="16" font-weight="700" fill="#12263A">No channel exists at all</text>
  <text x="1170" y="386" font-size="12.5" fill="#5B6B7B">Court procedure, criminal record certification, much sub-national</text>
  <text x="1170" y="406" font-size="12.5" fill="#5B6B7B">one-window service and parts of social assistance are published nowhere.</text>
  <rect x="1170" y="424" width="132" height="24" rx="12" fill="#FDECEC" stroke="#F3C9C9"/>
  <text x="1236" y="440" font-size="11.5" font-weight="700" fill="#9B2C2C" text-anchor="middle">Nothing to consult</text>

  <line x1="1385" y1="460" x2="1385" y2="500" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="1381,493 1389,493 1385,500" fill="#8FA0AF"/>

  <rect x="1150" y="500" width="470" height="130" rx="10" fill="#FFFFFF" stroke="#F3C9C9"/>
  <text x="1170" y="532" font-size="16" font-weight="700" fill="#12263A">Attend in person, or not at all</text>
  <text x="1170" y="556" font-size="12.5" fill="#5B6B7B">These procedures exist publicly only as counter notices and officer</text>
  <text x="1170" y="576" font-size="12.5" fill="#5B6B7B">knowledge. The citizen depends entirely on whoever they can reach.</text>
  <rect x="1170" y="594" width="110" height="24" rx="12" fill="#FDECEC" stroke="#F3C9C9"/>
  <text x="1225" y="610" font-size="11.5" font-weight="700" fill="#9B2C2C" text-anchor="middle">In-person only</text>

  <!-- Feeders into convergence bar -->
  <line x1="250" y1="630" x2="250" y2="680" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="246,673 254,673 250,680" fill="#8FA0AF"/>
  <line x1="595" y1="630" x2="595" y2="680" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="591,673 599,673 595,680" fill="#8FA0AF"/>
  <line x1="940" y1="630" x2="940" y2="680" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="936,673 944,673 940,680" fill="#8FA0AF"/>
  <line x1="1385" y1="630" x2="1385" y2="680" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="1381,673 1389,673 1385,680" fill="#8FA0AF"/>

  <!-- Convergence bar -->
  <rect x="90" y="680" width="1530" height="58" rx="10" fill="#12263A"/>
  <text x="855" y="706" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">No channel is both authoritative and free of travel.</text>
  <text x="855" y="726" font-size="12.5" fill="#A9BDCE" text-anchor="middle">The citizen acts on an answer they cannot date — or does not act at all.</text>

  <!-- Fan-out to outcomes -->
  <line x1="855" y1="738" x2="855" y2="772" stroke="#8FA0AF" stroke-width="1.5"/>
  <line x1="335" y1="772" x2="1375" y2="772" stroke="#8FA0AF" stroke-width="1.5"/>
  <line x1="335" y1="772" x2="335" y2="795" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="331,788 339,788 335,795" fill="#8FA0AF"/>
  <line x1="855" y1="772" x2="855" y2="795" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="851,788 859,788 855,795" fill="#8FA0AF"/>
  <line x1="1375" y1="772" x2="1375" y2="795" stroke="#8FA0AF" stroke-width="1.5"/>
  <polygon points="1371,788 1379,788 1375,795" fill="#8FA0AF"/>

  <text x="90" y="758" font-size="11.5" font-weight="700" fill="#8FA0AF" letter-spacing="1.6">OUTCOMES BORNE BY THE CITIZEN</text>

  <!-- Outcome 1 -->
  <rect x="90" y="795" width="490" height="100" rx="10" fill="#FDECEC" stroke="#F0C9C9"/>
  <text x="110" y="827" font-size="16" font-weight="700" fill="#7B1F1F">Wrong documents → turned away</text>
  <text x="110" y="853" font-size="12.5" fill="#8A4141">Sent home at the counter. A second trip, a second day of lost</text>
  <text x="110" y="873" font-size="12.5" fill="#8A4141">income, and the same uncertainty on arrival.</text>

  <!-- Outcome 2 -->
  <rect x="610" y="795" width="490" height="100" rx="10" fill="#FDECEC" stroke="#F0C9C9"/>
  <text x="630" y="827" font-size="16" font-weight="700" fill="#7B1F1F">Missed statutory deadline</text>
  <text x="630" y="853" font-size="12.5" fill="#8A4141">A registration window closes. The result is a penalty, or a right</text>
  <text x="630" y="873" font-size="12.5" fill="#8A4141">that can no longer be exercised at all.</text>

  <!-- Outcome 3 -->
  <rect x="1130" y="795" width="490" height="100" rx="10" fill="#FDECEC" stroke="#F0C9C9"/>
  <text x="1150" y="827" font-size="16" font-weight="700" fill="#7B1F1F">Payment to an intermediary</text>
  <text x="1150" y="853" font-size="12.5" fill="#8A4141">Public information is bought from a private broker, whose</text>
  <text x="1150" y="873" font-size="12.5" fill="#8A4141">commercial interest is that it stays hard to obtain.</text>

  <!-- GOVERNMENT LANE -->
  <rect x="30" y="975" width="1650" height="190" rx="14" fill="#F2F5F8" stroke="#DCE5ED" stroke-width="1"/>
  <text x="52" y="1001" font-size="11.5" font-weight="700" fill="#8FA0AF" letter-spacing="1.6">GOVERNMENT — WHAT THE SAME PROCESS COSTS THE STATE</text>

  <rect x="90" y="1020" width="490" height="120" rx="10" fill="#FFFFFF" stroke="#D5DEE7" stroke-dasharray="4 3"/>
  <text x="110" y="1050" font-size="15" font-weight="700" fill="#12263A">Officers answer one citizen at a time</text>
  <text x="110" y="1074" font-size="12.5" fill="#5B6B7B">Every answer is given verbally at a counter and nothing is</text>
  <text x="110" y="1092" font-size="12.5" fill="#5B6B7B">recorded, so there is no demand data — nobody knows which</text>
  <text x="110" y="1110" font-size="12.5" fill="#5B6B7B">questions citizens actually ask, or which step confuses them.</text>

  <rect x="610" y="1020" width="490" height="120" rx="10" fill="#FFFFFF" stroke="#D5DEE7" stroke-dasharray="4 3"/>
  <text x="630" y="1050" font-size="15" font-weight="700" fill="#12263A">A procedural change never propagates</text>
  <text x="630" y="1074" font-size="12.5" fill="#5B6B7B">A new fee, form or deadline is announced once. Ministry pages,</text>
  <text x="630" y="1092" font-size="12.5" fill="#5B6B7B">social posts and officer scripts are never reconciled against it,</text>
  <text x="630" y="1110" font-size="12.5" fill="#5B6B7B">so several versions stay in circulation at the same time.</text>

  <rect x="1130" y="1020" width="490" height="120" rx="10" fill="#FFFFFF" stroke="#D5DEE7" stroke-dasharray="4 3"/>
  <text x="1150" y="1050" font-size="15" font-weight="700" fill="#12263A">Stale published pages have no owner</text>
  <text x="1150" y="1074" font-size="12.5" fill="#5B6B7B">Nothing carries a review date or a named custodian. A page that</text>
  <text x="1150" y="1092" font-size="12.5" fill="#5B6B7B">has gone wrong stays wrong until a citizen is turned away</text>
  <text x="1150" y="1110" font-size="12.5" fill="#5B6B7B">because of it — and even then, no one is accountable for fixing it.</text>

  <!-- FOOTNOTE -->
  <text x="30" y="1200" font-size="11.5" fill="#8FA0AF">AskGov · Business Requirements Document · 2.1.1 Current Process (As-Is) — Kingdom of Cambodia, Digital Government Committee</text>

</svg>
